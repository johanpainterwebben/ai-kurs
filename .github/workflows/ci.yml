name: CI/CD

# Körs för varje pull request mot main och varje push till main.
#
#   Pull request: tester, lint och Docker-bygge med sårbarhetsskanning. Inga
#   hemligheter används, och pull_request (inte pull_request_target) ger kod
#   från forkar inga rättigheter.
#
#   Push till main: samma kontroller. Bara om alla lyckas byggs imagen,
#   skannas, publiceras på GHCR och signeras. Servern hämtar den signerade
#   imagen själv, eftersom den inte har några öppna portar (se DEPLOY.md,
#   "Automatisk driftsättning").
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # En gammal körning för en pull request är onödig, men en publicering
  # från main ska aldrig avbrytas halvvägs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Formatering
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags mock ./...
      # Inkluderar kontrasttestet (WCAG AAA) för web/style.css.
      - name: go test -race
        run: go test -race ./...
      - name: Benchmark för Suggest
        run: go test -run xxx -bench Suggest -benchmem ./internal/places/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bygg imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: temperatur:ci
      - name: Sårbarhetsskanning (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: temperatur:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Frontend (bygge, svelte-check, lint, npm audit) läggs till här när
  # webbsidan har flyttats till Svelte och Vite.

  publish:
    name: Publicera och signera
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, lint, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write # publicera imagen på GHCR
      id-token: write # signera utan nyckel: cosign får ett kortlivat certifikat via GitHubs OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Imagens namn
        # GHCR kräver gemener.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bygg imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      # Samma image som skannas här är den som publiceras.
      - name: Sårbarhetsskanning (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Taggen med commit-SHA ändras aldrig. Taggen main pekar på den senaste
      # godkända versionen; det är den servern frågar efter.
      - name: Publicera
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push --quiet "$IMAGE:$GITHUB_SHA"
          docker push --quiet "$IMAGE:main"
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Publicerad: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Servern startar bara imagar med en signatur från just det här
      # workflowet på main. Signaturen knyts till digesten, inte till taggen.
      - name: Signera
        run: cosign sign --yes "$IMAGE@$DIGEST"
