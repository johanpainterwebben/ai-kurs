services:
  temperatur:
    # Servern kör den image som CI har byggt, testat och signerat, låst till
    # sin digest. IMAGE_REF sätts av deploy/pull-deploy.sh. För att bygga
    # lokalt i stället: docker compose -f docker-compose.yml -f compose.build.yml up -d --build
    image: ${IMAGE_REF:-temperatur:local}
    pull_policy: never # imagen hämtas och kontrolleras av driftskriptet, aldrig av compose
    restart: unless-stopped
    env_file: .env
    ports:
      # Bara lokalt, för felsökning med curl. Utåt går trafiken via den omvända
      # proxyn och tunneln i serverrepot, som når appen på det delade nätverket.
      - "127.0.0.1:8080:8080"
    networks: [proxy]
    # Servern skriver inget till disk och behöver inga extra rättigheter.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy:
    # Skapas av serverrepot; starta det först.
    external: true
