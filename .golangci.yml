version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Testerna skriver egna filer och anropar egna servrar; strikta
      # säkerhets- och felkontroller ger mest brus där.
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
